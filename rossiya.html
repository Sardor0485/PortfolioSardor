<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Xarajat & Foyda Hisoblagichi</title>
<style>
  body { font-family: Arial, sans-serif; background:#eef2f7; padding:20px; }
  .container { background:#fff; padding:20px; max-width:600px; margin:auto; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,0.1);}
  label { display:block; margin-top:10px; font-weight:bold; }
  input { width:100%; padding:8px; margin-top:5px; border-radius:4px; border:1px solid #ccc; }
  button { margin-top:20px; width:100%; padding:12px; background:#28a745; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:16px; }
  button:hover { background:#218838; }
  .result { margin-top:20px; padding:15px; background:#f8f9fa; border-radius:8px; font-weight:bold; }
  .box { padding:12px; border-radius:6px; margin-top:10px; }
  .rub { background:#ffeeba; }
  .usd { background:#c3e6cb; }
  .uzs { background:#bee5eb; }
</style>
</head>
<body>
<div class="container">
  <h2 style="text-align:center;">🧮 Xarajat & Foyda Hisoblagichi</h2>
  
  <label>Oylik daromad (RUB)</label>
  <input id="income" type="number" placeholder="Masalan: 80000">

  <label>Patent to‘lovi (har oy, RUB)</label>
  <input id="patent" type="number" placeholder="Masalan: 5000">

  <label>Trudovoy dogovor (har oy, RUB)</label>
  <input id="trudovoy" type="number" placeholder="Masalan: 3000">

  <label>Registratsiya (har oy, RUB)</label>
  <input id="reg" type="number" placeholder="Masalan: 1000">

  <label>Kvartira (har oy, RUB)</label>
  <input id="rent" type="number" placeholder="Masalan: 20000">

  <label>Oziq-ovqat (kunlik, RUB)</label>
  <input id="food" type="number" placeholder="Masalan: 500">

  <label>Transport (kunlik, RUB)</label>
  <input id="trans" type="number" placeholder="Masalan: 200">

  <label>Boshqa (har oy, RUB)</label>
  <input id="other" type="number" placeholder="Masalan: 3000">
  
  <label>Oyda kunlar soni</label>
  <input id="days" type="number" placeholder="Masalan: 30">

  <label>Dollar kursi (1 USD = ? RUB)</label>
  <input id="usdRate" type="number" placeholder="Masalan: 100">

  <label>So‘m kursi (1 USD = ? UZS)</label>
  <input id="uzsRate" type="number" placeholder="Masalan: 12500">

  <label>Hisoblash uchun oylar soni</label>
  <input id="months" type="number" placeholder="Masalan: 12">

  <hr>
  <label>🇺🇿 O‘zbekistonda kunlik daromad (UZS)</label>
  <input id="uzbDaily" type="number" placeholder="Masalan: 200000">

  <button onclick="calculate()">Hisoblash</button>

  <div class="result" id="result"></div>
</div>

<script>
function calculate() {
  const inc = parseFloat(document.getElementById('income').value) || 0;
  const patent = parseFloat(document.getElementById('patent').value) || 0;
  const t = parseFloat(document.getElementById('trudovoy').value) || 0;
  const r = parseFloat(document.getElementById('reg').value) || 0;
  const rent = parseFloat(document.getElementById('rent').value) || 0;
  const food = (parseFloat(document.getElementById('food').value) || 0) * (parseFloat(document.getElementById('days').value)||30);
  const trans = (parseFloat(document.getElementById('trans').value) || 0) * (parseFloat(document.getElementById('days').value)||30);
  const other = parseFloat(document.getElementById('other').value) || 0;

  const usdRate = parseFloat(document.getElementById('usdRate').value) || 100;
  const uzsRate = parseFloat(document.getElementById('uzsRate').value) || 12500;
  const months = parseFloat(document.getElementById('months').value) || 1;

  const uzbDaily = parseFloat(document.getElementById('uzbDaily').value) || 0;

  // Rossiya hisob-kitobi
  const expenses = patent + t + r + rent + food + trans + other;
  const profitRub = inc - expenses;
  const profitUSD = profitRub / usdRate;
  const profitUZS = profitUSD * uzsRate;

  // O‘zbekiston hisob-kitobi
  const uzbMonthly = uzbDaily * (parseFloat(document.getElementById('days').value) || 30);
  const uzbUSD = uzbMonthly / uzsRate;
  const uzbRUB = uzbUSD * usdRate;

  document.getElementById('result').innerHTML = `
    <h3>🇷🇺 Rossiya</h3>
    <div class="box rub">💰 Oylik xarajatlar: <strong>${expenses.toLocaleString()}</strong> RUB</div>
    <div class="box rub">📅 Oylik foyda: <strong>${profitRub.toLocaleString()}</strong> RUB</div>
    <div class="box usd">💵 Oylik foyda: <strong>$${profitUSD.toFixed(2)}</strong> USD</div>
    <div class="box uzs">🇺🇿 Oylik foyda: <strong>${profitUZS.toLocaleString()}</strong> so‘m</div>

    <h3>🇺🇿 O‘zbekiston</h3>
    <div class="box uzs">📅 Oylik daromad: <strong>${uzbMonthly.toLocaleString()}</strong> so‘m</div>
    <div class="box usd">💵 USD’da: <strong>$${uzbUSD.toFixed(2)}</strong></div>
    <div class="box rub">💰 RUB’da: <strong>${uzbRUB.toLocaleString()}</strong></div>

    <h3>📊 Taqqoslash</h3>
    <div class="box ${profitUZS > uzbMonthly ? 'usd' : 'rub'}">
      Rossiyada foyda O‘zbekistondagidan <strong>${(profitUZS - uzbMonthly).toLocaleString()}</strong> so‘mga ${profitUZS > uzbMonthly ? 'ko‘p' : 'kam'}.
    </div>
  `;
}
</script>
</body>
</html>
